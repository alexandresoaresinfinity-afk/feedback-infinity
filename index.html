<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Piercing — Gestão de Desempenho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== TELA DE LOGIN ===== -->
  <div id="tela-login" class="tela">
    <div class="card-login">
      <img src="logo.png" alt="Infinity Piercing" class="logo">
      <h1>Gestão de Desempenho</h1>
      <p class="sub">Entre com seu nome e código de acesso</p>

      <label>Seu nome
        <input type="text" id="login-nome" placeholder="Ex.: Maria Silva">
      </label>

      <label>Código de acesso
        <input type="password" id="login-codigo" placeholder="Código fornecido pelo Admin">
      </label>

      <button class="btn-primario" onclick="fazerLogin()">Entrar</button>
      <p id="login-erro" class="erro"></p>
    </div>
  </div>

  <!-- ===== SISTEMA (aparece depois do login) ===== -->
  <div id="sistema" class="tela escondido">
    <header class="topo">
      <div class="logo-marca">
        <img src="logo.png" alt="Infinity Piercing" class="logo">
        <div class="logo-texto">
          <span class="logo-linha1">INFINITY</span>
          <span class="logo-linha2">PIERCING</span>
        </div>
      </div>
      <div class="usuario-info">
        <span id="usuario-nome"></span>
        <span id="usuario-perfil" class="badge"></span>
        <button class="btn-sair" onclick="sair()">Sair</button>
      </div>
    </header>

    <main>
      <!-- Mural de Elogios -->
      <section class="card">
        <h2>🌟 Mural de Elogios</h2>
        <p class="sub">Reconheça o trabalho de alguém do time</p>

        <form id="form-elogio">
          <label>Para quem é o elogio?
            <select id="e-para">
              <option value="">Selecione a pessoa...</option>
            </select>
          </label>

          <label>O que você quer elogiar?
            <textarea id="e-texto" placeholder="Ex.: Atendimento incrível com o cliente hoje!" required></textarea>
          </label>

          <button type="submit" class="btn-primario">Publicar elogio</button>
        </form>
      </section>

      <!-- Lista de elogios -->
      <section class="card">
        <h2>📋 Elogios do time</h2>
        <div id="lista-elogios"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
